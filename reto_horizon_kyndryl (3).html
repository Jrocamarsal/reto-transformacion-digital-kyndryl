<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ff462d">
<title>Reto Transformación Digital — Kyndryl</title>
<style>

:root{--bg:#f7f4ef;--surface:#fff;--surface2:#eee9e1;--ink:#211a17;--muted:#776c65;--border:#ded5cb;--accent:#ff462d;--accent2:#d63a23;--teal:#0e8f70;--bad:#d23b2e;--gold:#b57a12;--shadow:0 16px 40px rgba(33,26,23,.12)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink)}body{font-family:Arial,Helvetica,sans-serif;padding:18px 14px 24px;display:flex;justify-content:center}.display{font-family:Arial Black,Arial,Helvetica,sans-serif}.mono{font-family:Consolas,'Courier New',monospace}button,input{font:inherit}button{cursor:pointer}
#app{width:100%;max-width:720px}.topbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:10px}.brand{font-family:Arial Black,Arial,Helvetica,sans-serif;font-weight:800;font-size:14px;letter-spacing:.03em}.brand span{color:var(--accent)}.brand small{font:600 10px Arial,sans-serif;letter-spacing:.13em;color:var(--muted);margin-left:8px;text-transform:uppercase}.timer{min-width:74px;padding:6px 11px;border:1px solid var(--border);background:var(--surface);border-radius:999px;text-align:center;font-weight:700;font-size:13px}.timer.hidden{visibility:hidden}
.progress{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:14px}.progress span{height:6px;border-radius:99px;background:var(--border)}.progress span.done{background:var(--teal)}.progress span.current{background:var(--accent);box-shadow:0 0 0 2px rgba(255,70,45,.14)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:24px;box-shadow:var(--shadow);min-height:500px;display:flex;flex-direction:column;gap:16px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.15em;color:var(--accent2);font-weight:700}.title{font-size:28px;line-height:1.12;margin:0;font-weight:800}.subtitle{font-size:15px;line-height:1.55;color:var(--muted);margin:0}.btn{border:0;border-radius:14px;padding:14px 18px;font-weight:700;transition:transform .12s ease,filter .12s ease}.btn:active{transform:scale(.98)}.btn:focus-visible{outline:3px solid rgba(255,70,45,.25);outline-offset:2px}.primary{background:var(--accent);color:#fff}.primary:hover{filter:brightness(1.04)}.ghost{background:transparent;color:var(--ink);border:1px solid var(--border)}.danger{color:var(--bad)}.row{display:flex;gap:10px}.row>*{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:7px}.chip{padding:7px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12px;font-weight:600;color:var(--muted)}input[type=text]{width:100%;padding:14px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);color:var(--ink);font-size:16px}.label{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:6px;display:block}.feedback{padding:10px 12px;border-radius:12px;font-size:14px;font-weight:700}.feedback.ok{background:rgba(14,143,112,.12);color:var(--teal)}.feedback.bad{background:rgba(210,59,46,.12);color:var(--bad)}
/* Reto 1 */.cipher{background:linear-gradient(135deg,#1f1917,#302724);border-radius:18px;padding:22px;color:#fff;position:relative;overflow:hidden}.cipher:after{content:'';position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 22px,rgba(255,255,255,.035) 22px 23px);pointer-events:none}.cipher-code{font:700 24px Consolas,'Courier New',monospace;letter-spacing:.14em;position:relative;z-index:1;text-align:center}.cipher-preview{font:800 25px Consolas,'Courier New',monospace;text-align:center;color:#ff8b77;min-height:32px;margin-top:8px;position:relative;z-index:1}.slider-wrap{display:flex;gap:10px;align-items:center}.slider-wrap button{width:44px;height:44px;border-radius:50%;border:1px solid var(--border);background:var(--surface);font-size:22px;font-weight:800}.slider-wrap input{flex:1;accent-color:var(--accent)}
/* Reto 2 */.match-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px}.match-col h3{font-size:12px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin:0 0 8px}.match-item,.area-item{border:1px solid var(--border);border-radius:14px;padding:12px;background:var(--surface2);margin-bottom:8px;transition:.15s;user-select:none}.match-item{font-size:13px;line-height:1.35;min-height:74px}.area-item{text-align:center;font-weight:700;font-size:12px;background:#fff}.match-item.selected,.area-item.selected{border-color:var(--accent);box-shadow:0 0 0 3px rgba(255,70,45,.12)}.match-item.locked,.area-item.locked{border-color:var(--teal);opacity:.6}.shake{animation:shake .35s}.match-note{font-size:12px;color:var(--muted)}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
/* Reto 3 */.memory-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:500px;width:100%;margin:0 auto}.memory-card{aspect-ratio:1;border:1px solid var(--border);border-radius:14px;background:var(--surface2);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden;cursor:pointer;user-select:none}.memory-card .back{font:800 22px 'Unbounded';color:var(--accent);opacity:.8}.memory-card .front{display:none;text-align:center;font-size:11px;font-weight:800;line-height:1.15;padding:6px}.memory-card.open,.memory-card.matched{background:var(--surface);border-color:var(--accent)}.memory-card.open .back,.memory-card.matched .back{display:none}.memory-card.open .front,.memory-card.matched .front{display:block}.memory-card.matched{border-color:var(--teal);background:rgba(14,143,112,.1)}
/* Reto 4 */.explore-box{border:1px dashed var(--border);background:var(--surface2);border-radius:16px;padding:18px}.web-btn{display:block;text-align:center;text-decoration:none}.hint{border-left:3px solid var(--accent);padding-left:10px;font-size:13px;color:var(--muted)}
/* Reto 5 */.sequence{display:flex;flex-direction:column;gap:9px}.step{display:flex;align-items:center;gap:10px;padding:13px;border-radius:14px;border:1px solid var(--border);background:var(--surface2);cursor:pointer}.step.selected{border-color:var(--accent);background:rgba(255,70,45,.08)}.num{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:1px solid var(--border);font:700 12px Consolas,'Courier New',monospace;flex:none}
/* Reto 6: juego 100% HTML/CSS */.reflex-game{position:relative;height:300px;border:1px solid var(--border);border-radius:18px;background:linear-gradient(180deg,#fff,#f1ece5);overflow:hidden;touch-action:none}.reflex-lane{position:absolute;right:0;top:0;bottom:0;width:52px;border-left:2px dashed var(--border);background:rgba(255,70,45,.035)}.packet{position:absolute;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:9px;font-weight:900;box-shadow:0 8px 14px rgba(33,26,23,.12);transform:translate(-50%,-50%);user-select:none}.packet.clean{background:var(--teal)}.packet.threat{background:var(--bad)}.reflex-hud{position:absolute;top:10px;left:10px;right:10px;display:flex;justify-content:space-between;z-index:2}.pill{background:#fff;border:1px solid var(--border);border-radius:999px;padding:5px 10px;font:700 11px Consolas,'Courier New',monospace}.target-zone{position:absolute;right:5px;top:0;bottom:0;width:42px;z-index:1}.reflex-help{display:flex;gap:8px;flex-wrap:wrap;font-size:12px;color:var(--muted)}.legend{display:flex;align-items:center;gap:5px}.dotc{width:10px;height:10px;border-radius:50%}.dotc.clean{background:var(--teal)}.dotc.threat{background:var(--bad)}
/* Final / form */.final{align-items:center;text-align:center;justify-content:center}.trophy{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(145deg,var(--gold),var(--accent));color:#fff;font-size:34px;box-shadow:0 16px 24px rgba(255,70,45,.18)}.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:100%;max-width:430px}.stat{background:var(--surface2);border:1px solid var(--border);border-radius:14px;padding:12px}.stat b{display:block;font:800 20px Consolas,'Courier New',monospace}.stat span{font-size:10px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted)}.form-card{width:100%;max-width:500px;border:1px solid var(--border);background:var(--surface2);border-radius:16px;padding:16px}.form-card p{color:var(--muted);font-size:13px}.footer{text-align:center;color:var(--muted);font-size:11px;margin-top:10px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);padding:8px 13px;border-radius:999px;background:var(--bad);color:#fff;font:700 12px Consolas,'Courier New',monospace;opacity:0;pointer-events:none;transition:.18s;z-index:50}.toast.show{opacity:1}
.confetti-zone{position:relative;height:46px;width:100%;overflow:hidden}.confetti-piece{position:absolute;top:-14px;width:8px;height:16px;border-radius:2px;animation:fall 1.8s linear forwards}.confetti-piece:nth-child(3n){background:var(--accent)}.confetti-piece:nth-child(3n+1){background:var(--teal)}.confetti-piece:nth-child(3n+2){background:var(--gold)}@keyframes fall{to{transform:translateY(70px) rotate(300deg);opacity:0}}
@media(max-width:600px){body{padding:10px 10px 18px}.topbar{margin-bottom:8px}.brand{font-size:12px;line-height:1.2}.card{padding:17px;border-radius:18px;gap:14px}.title{font-size:22px}.subtitle{font-size:14px}.btn{width:100%;min-height:48px;padding:13px 16px;touch-action:manipulation}.row{flex-direction:column}.match-layout{grid-template-columns:1fr;gap:6px}.match-col:nth-child(2){margin-top:8px}.match-item{min-height:82px;padding:13px;font-size:13px}.area-item{min-height:50px;display:flex;align-items:center;justify-content:center;padding:12px;font-size:12px}.memory-grid{grid-template-columns:repeat(4,1fr);gap:6px}.memory-card{border-radius:10px;min-width:0}.memory-card .front{font-size:9px}.reflex-game{height:260px}.packet{width:32px;height:32px}.brand small{display:none}.timer{min-width:68px}.progress{gap:4px;margin-bottom:10px}}
@media(min-width:601px){.match-item,.area-item,.btn{touch-action:manipulation}.btn{min-height:48px}}
@media(hover:none){.btn:hover{filter:none}.match-item:active,.area-item:active,.step:active,.memory-card:active{transform:scale(.985)}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar"><div class="brand">KYNDRYL<span>·</span>TRANSFORMACIÓN DIGITAL <small>Feria de Empleo</small></div><div id="timer" class="timer hidden">00:00</div></div>
  <div id="progress" class="progress" aria-label="Progreso"></div>
  <main id="screen"></main>
  <div class="footer">Kyndryl · Reto Horizon</div>
</div>
<div id="toast" class="toast"></div>
<script>
(function(){
'use strict';
const FORM_URL='https://forms.cloud.microsoft/r/EEtPsz3Nuq';
const TOTAL=6, PENALTY=5000;
const S={alias:'',step:-1,start:null,elapsed:0,results:{},scavAnswer:'',scavTries:0};
const SESSION_KEY='kyndryl_transformacion_digital_state_v2';
function saveSession(){try{sessionStorage.setItem(SESSION_KEY,JSON.stringify(S))}catch(e){}}
function restoreSession(){try{const raw=sessionStorage.getItem(SESSION_KEY);if(!raw)return false;const saved=JSON.parse(raw);if(!saved||typeof saved!=='object')return false;Object.assign(S,saved);return true}catch(e){return false}}
function clearSession(){try{sessionStorage.removeItem(SESSION_KEY)}catch(e){}}

const screen=document.getElementById('screen'), timer=document.getElementById('timer'), progress=document.getElementById('progress'), toast=document.getElementById('toast');
let timerId=null;
function fmt(ms){let s=Math.floor(ms/1000),m=Math.floor(s/60);s%=60;return String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')}
function startTimer(){if(!S.start)S.start=Date.now();timer.classList.remove('hidden');clearInterval(timerId);timer.textContent=fmt(Date.now()-S.start);timerId=setInterval(()=>{timer.textContent=fmt(Date.now()-S.start);saveSession()},250);saveSession()}
function stopTimer(){clearInterval(timerId);timerId=null;S.elapsed=S.start?Date.now()-S.start:0;saveSession()}
function penalty(){if(!S.start)return;S.start-=PENALTY; timer.textContent=fmt(Date.now()-S.start);saveSession();timer.animate([{transform:'scale(1)'},{transform:'scale(1.08)'},{transform:'scale(1)'}],{duration:450});toast.textContent='+5 s de penalización';toast.classList.add('show');setTimeout(()=>toast.classList.remove('show'),900)}
function feedback(ok,text){const el=document.createElement('div');el.className='feedback '+(ok?'ok':'bad');el.textContent=text;return el}
function paintProgress(){progress.innerHTML=''; if(S.step<0||S.step>=TOTAL){progress.style.display='none';return} progress.style.display='grid';for(let i=0;i<TOTAL;i++){const x=document.createElement('span');x.className=i<S.step?'done':i===S.step?'current':'';progress.appendChild(x)}}
function go(step){S.step=step;saveSession();paintProgress(); if(step===-1)intro();else if(step===0)cipher();else if(step===1)match();else if(step===2)memory();else if(step===3)scavenger();else if(step===4)sequence();else if(step===5)reflex();else final();scrollTo({top:0,behavior:'smooth'})}
function base(ey,title,sub){const c=document.createElement('section');c.className='card';c.innerHTML=`<div class="eyebrow">${ey}</div><h1 class="display title">${title}</h1><p class="subtitle">${sub}</p>`;return c}
function intro(){timer.classList.add('hidden');const c=base('Stand Kyndryl · Programa Horizon','Reto Transformación Digital','Conecta, resuelve y transforma. Seis pruebas rápidas para descubrir cómo Kyndryl ayuda a transformar negocios con cloud, ciberseguridad, datos, IA y conectividad.');c.innerHTML+=`<div class="chips"><span class="chip">Security & Resiliency</span><span class="chip">IA agéntica</span><span class="chip">Cloud</span><span class="chip">Network & Edge</span><span class="chip">Apps, Data & AI</span><span class="chip">+ sorpresa</span></div><p class="subtitle"><b>6 pruebas · ~5 minutos</b></p><div><label class="label" for="alias">Elige un alias</label><input id="alias" maxlength="18" placeholder="Ej. HalconRed_07" autocomplete="off"></div><button class="btn primary" id="start">Empezar el reto</button>`;screen.replaceChildren(c);const input=c.querySelector('#alias'),btn=c.querySelector('#start');input.value=S.alias;btn.disabled=!S.alias;btn.style.opacity=btn.disabled?.55:1;input.addEventListener('input',()=>{S.alias=input.value.trim();btn.disabled=!S.alias;btn.style.opacity=btn.disabled?.55:1});input.addEventListener('keydown',e=>{if(e.key==='Enter'&&!btn.disabled)btn.click()});btn.addEventListener('click',()=>{if(!S.alias)return;startTimer();go(0)})}
function cipher(){const c=base('Reto 1 · Security & Resiliency','Descifra el mensaje','Usa el desplazamiento para revelar el principio que está detrás de nuestra aproximación de seguridad. Empieza en 0 y ajusta hasta que aparezca una frase con sentido.');c.innerHTML+=`<div class="cipher"><div class="cipher-code">JVUMPHUGH JLYV</div><div id="preview" class="cipher-preview"></div></div><div class="slider-wrap"><button id="minus">−</button><input id="range" type="range" min="0" max="25" value="0"><button id="plus">+</button></div><div id="shift" class="subtitle mono" style="text-align:center">Desplazamiento: 0</div><button id="check" class="btn primary">Comprobar</button>`;screen.replaceChildren(c);const range=c.querySelector('#range'),preview=c.querySelector('#preview'),shift=c.querySelector('#shift');function decode(n){return 'JVUMPHUGH JLYV'.replace(/[A-Z]/g,ch=>String.fromCharCode(((ch.charCodeAt(0)-65-n+26)%26)+65))}function refresh(){const n=+range.value;preview.textContent=decode(n);shift.textContent='Desplazamiento: '+n}refresh();range.addEventListener('input',refresh);c.querySelector('#minus').onclick=()=>{range.value=(+range.value+25)%26;refresh()};c.querySelector('#plus').onclick=()=>{range.value=(+range.value+1)%26;refresh()};c.querySelector('#check').onclick=()=>{if(preview.textContent==='CONFIANZA CERO'){c.appendChild(feedback(true,'Correcto: «Confianza cero».'));S.results.cipher=true;setTimeout(()=>go(1),700)}else{penalty();c.appendChild(feedback(false,'Aún no. Sigue ajustando el desplazamiento.'))}}}
const TOWERS=[['cloud','Cloud','Diseña, migra y gestiona infraestructuras híbridas y multicloud.'],['core','Core Enterprise','Moderniza y opera sistemas core y mainframe, conectándolos con la nube.'],['aidata','Apps, Data & AI','Moderniza aplicaciones y despliega soluciones de datos e IA, incluida la IA agéntica.'],['workplace','Digital Workplace','Infraestructura, movilidad y seguridad de acceso para trabajar desde cualquier lugar.'],['security','Security & Resiliency','Ciberseguridad, continuidad de negocio y recuperación ante desastres.'],['network','Network & Edge','Servicios de red para conectar nube, centros de datos y entorno edge.']];
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function match(){const c=base('Reto 2 · Nuestras capacidades','Empareja cada reto con su área','Las descripciones y las áreas están desordenadas por separado. Selecciona primero un reto y después pulsa el área que creas correcta.');c.innerHTML+=`<div class="match-layout"><div class="match-col"><h3>Retos desordenados</h3><div id="desc"></div></div><div class="match-col"><h3>Áreas desordenadas</h3><div id="areas"></div></div></div><p class="match-note">En móvil, la lista se apila para que los botones sean grandes y fáciles de tocar.</p>`;screen.replaceChildren(c);let selected=null,done=0;const d=c.querySelector('#desc'),a=c.querySelector('#areas');const descriptions=shuffle(TOWERS.map(([id,name,desc])=>({id,name,desc})));const areas=shuffle(TOWERS.map(([id,name])=>({id,name})));
function chooseDesc(id,x){if(x.classList.contains('locked'))return;d.querySelectorAll('.match-item').forEach(v=>v.classList.remove('selected'));x.classList.add('selected');selected=id;}
function chooseArea(id,y){if(!selected||y.classList.contains('locked'))return;if(y.dataset.id===selected){y.classList.add('locked');const dx=d.querySelector(`[data-id="${selected}"]`);dx.classList.remove('selected');dx.classList.add('locked');selected=null;done++;if(done===TOWERS.length){c.appendChild(feedback(true,'¡Todas las capacidades conectadas!'));S.results.match=true;setTimeout(()=>go(2),700)}}else{y.classList.add('shake');c.appendChild(feedback(false,'No coincide. Prueba con otra área.'));setTimeout(()=>y.classList.remove('shake'),400)}}
descriptions.forEach(({id,desc})=>{const x=document.createElement('div');x.className='match-item';x.dataset.id=id;x.textContent=desc;x.tabIndex=0;x.setAttribute('role','button');x.onclick=()=>chooseDesc(id,x);x.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseDesc(id,x)}};d.appendChild(x)});
areas.forEach(({id,name})=>{const y=document.createElement('div');y.className='area-item';y.dataset.id=id;y.textContent=name;y.tabIndex=0;y.setAttribute('role','button');y.onclick=()=>chooseArea(id,y);y.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();chooseArea(id,y)}};a.appendChild(y)});}
const MEM=[['multicloud','Multicloud'],['hybrida','Híbrida'],['onpremise','On-premise'],['migracion','Migración'],['contenedores','Contenedores'],['automatizacion','Automatización']];
function memory(){const c=base('Reto 3 · Cloud','Memoria cloud','Encuentra las 6 parejas de conceptos que aparecen en proyectos de nube. Cada error suma 5 segundos.');c.innerHTML+=`<div id="mem" class="memory-grid"></div>`;screen.replaceChildren(c);const items=shuffle(MEM.flatMap(v=>[v,v]));const grid=c.querySelector('#mem');let open=[],lock=false,matched=0;items.forEach(([id,label])=>{const x=document.createElement('div');x.className='memory-card';x.dataset.id=id;x.innerHTML=`<span class="back">K</span><span class="front">${label}</span>`;x.onclick=()=>{if(lock||x.classList.contains('open')||x.classList.contains('matched'))return;x.classList.add('open');open.push(x);if(open.length===2){lock=true;if(open[0].dataset.id===open[1].dataset.id){setTimeout(()=>{open.forEach(v=>v.classList.add('matched'));open=[];lock=false;matched++;if(matched===MEM.length){c.appendChild(feedback(true,'¡Memoria completada!'));S.results.memory=true;setTimeout(()=>go(3),700)}},220)}else{penalty();setTimeout(()=>{open.forEach(v=>v.classList.remove('open'));open=[];lock=false},650)}}};grid.appendChild(x)})}
function scavenger(){const c=base('Reto 4 · Conoce Kyndryl','Explora kyndryl.com','El nombre «Kyndryl» combina dos palabras en inglés. Entra en la web oficial y busca la sección donde Kyndryl explica quién es y qué hace la compañía. Allí encontrarás el origen del nombre. Escribe las dos palabras.');c.innerHTML+=`<div class="explore-box"><a class="btn ghost web-btn" href="https://www.kyndryl.com" target="_self">Abrir kyndryl.com ↗</a></div><input id="ans" type="text" placeholder="Ej. palabra1 y palabra2" autocomplete="off"><div id="hint" class="hint" hidden></div><button id="go" class="btn primary">Comprobar</button>`;screen.replaceChildren(c);let tries=Number(S.scavTries||0);const input=c.querySelector('#ans'),hint=c.querySelector('#hint');input.value=S.scavAnswer||'';if(tries>=2){hint.hidden=false;hint.textContent='Pista: en kyndryl.com busca información sobre qué hace Kyndryl y sobre la compañía (por ejemplo, la sección ‘About us / Sobre Kyndryl’). Dentro de la explicación del nombre encontrarás dos ideas: una relacionada con familia/conexión y otra con una planta que crece enredándose.'}input.addEventListener('input',()=>{S.scavAnswer=input.value;saveSession()});c.querySelector('#go').onclick=()=>{const v=input.value.toLowerCase();const ok=(v.includes('kinship')||v.includes('parentesco'))&&(v.includes('tendril')||v.includes('zarcillo'));if(ok){S.scavAnswer=input.value;S.results.scavenger=true;saveSession();c.appendChild(feedback(true,'Exacto: kinship + tendril.'));setTimeout(()=>go(4),700)}else{tries++;S.scavTries=tries;saveSession();c.appendChild(feedback(false,'Todavía no. Busca las dos palabras.'));if(tries>=2){hint.hidden=false;hint.textContent='Pista: en kyndryl.com busca información sobre qué hace Kyndryl y sobre la compañía (por ejemplo, la sección ‘About us / Sobre Kyndryl’). Dentro de la explicación del nombre encontrarás dos ideas: una relacionada con familia/conexión y otra con una planta que crece enredándose.'}}}}
const SEQ=['Analizar datos y procesos existentes','Diseñar el flujo de trabajo con IA','Desarrollar y entrenar el agente de IA','Integrar con los sistemas empresariales','Monitorizar y gobernar con policy-as-code'];
function sequence(){const c=base('Reto 5 · Apps, Data & AI','Ordena el flujo de un proyecto de IA','Toca dos pasos para intercambiarlos hasta dejar el flujo completo en el orden correcto.');const list=document.createElement('div');list.className='sequence';c.appendChild(list);const btn=document.createElement('button');btn.className='btn primary';btn.textContent='Comprobar orden';c.appendChild(btn);screen.replaceChildren(c);let arr=shuffle(SEQ.map((text,correctPos)=>({text,correctPos}))),selected=null;function render(){list.innerHTML='';arr.forEach((it,i)=>{const x=document.createElement('div');x.className='step';if(selected===i)x.classList.add('selected');x.innerHTML=`<span class="num">${i+1}</span><span>${it.text}</span>`;x.onclick=()=>{if(selected===null){selected=i;x.classList.add('selected')}else if(selected===i){selected=null;x.classList.remove('selected')}else{[arr[selected],arr[i]]=[arr[i],arr[selected]];selected=null;render()}};list.appendChild(x)})}render();btn.onclick=()=>{if(arr.every((it,i)=>it.correctPos===i)){c.appendChild(feedback(true,'Ese es el flujo correcto.'));S.results.sequence=true;setTimeout(()=>go(5),700)}else{penalty();c.appendChild(feedback(false,'El orden todavía no es correcto.'))}}}
function reflex(){const c=base('Reto 6 · Network & Edge','Protege la red','Toca los paquetes <b>limpios</b> antes de que crucen el borde. Evita las amenazas. Necesitas 8 puntos en 15 segundos.');c.innerHTML+=`<div class="reflex-game" id="game"><div class="reflex-hud"><span id="score" class="pill">Puntos: 0</span><span id="time" class="pill">15s</span></div><div class="reflex-lane"></div></div><div class="reflex-help"><span class="legend"><i class="dotc clean"></i> limpio = +1</span><span class="legend"><i class="dotc threat"></i> amenaza = -1</span></div><button id="startGame" class="btn primary">Iniciar 15 segundos</button>`;screen.replaceChildren(c);const game=c.querySelector('#game'),scoreEl=c.querySelector('#score'),timeEl=c.querySelector('#time'),start=c.querySelector('#startGame');let running=false,score=0,left=15,spawnId=null,raf=null,packets=[];function spawn(){const p=document.createElement('div');const threat=Math.random()<.43;p.className='packet '+(threat?'threat':'clean');p.textContent=threat?'!':'+';p.dataset.threat=threat?'1':'0';p.style.left='-30px';p.style.top=(52+Math.random()*(game.clientHeight-90))+'px';game.appendChild(p);packets.push({el:p,x:-30,y:parseFloat(p.style.top),v:1.8+Math.random()*1.7,threat})}function frame(){if(!running)return;packets.forEach(p=>{p.x+=p.v;p.el.style.left=p.x+'px';if(p.x>game.clientWidth+35){p.el.remove();p.dead=true}});packets=packets.filter(p=>!p.dead);raf=requestAnimationFrame(frame)}function tap(e){if(!running)return;const t=e.target.closest('.packet');if(!t)return;const p=packets.find(q=>q.el===t);if(!p)return;p.dead=true;t.remove();score=Math.max(0,score+(p.threat?-1:1));scoreEl.textContent='Puntos: '+score}function end(){running=false;clearInterval(spawnId);cancelAnimationFrame(raf);if(score>=8){c.appendChild(feedback(true,'¡Red protegida! '+score+' puntos.'));S.results.reflex=true;setTimeout(()=>go(6),850)}else{c.appendChild(feedback(false,'Te faltaron puntos ('+score+'/8). Puedes reintentarlo.'));start.hidden=false;start.textContent='Reintentar'}}start.onclick=()=>{c.querySelectorAll('.feedback').forEach(x=>x.remove());packets.forEach(p=>p.el.remove());packets=[];score=0;left=15;scoreEl.textContent='Puntos: 0';timeEl.textContent='15s';running=true;start.hidden=true;spawnId=setInterval(()=>{if(running)spawn()},420);raf=requestAnimationFrame(frame);const iid=setInterval(()=>{left--;timeEl.textContent=left+'s';if(left<=0){clearInterval(iid);end()}},1000)};game.addEventListener('pointerdown',tap);}
function final(){stopTimer();timer.classList.add('hidden');paintProgress();progress.style.display='none';const c=document.createElement('section');c.className='card final';const safe=S.alias.replace(/[<>]/g,'');c.innerHTML=`<div class="confetti-zone" id="conf"></div><div class="trophy">★</div><div class="eyebrow">Horizon completado</div><h1 class="display title">¡Reto superado!</h1><p class="subtitle">Buen trabajo, <b>${safe}</b>. Has completado las 6 pruebas.</p><div class="stats"><div class="stat"><b>${fmt(S.elapsed)}</b><span>Tiempo total</span></div><div class="stat"><b>6/6</b><span>Retos</span></div></div><p class="subtitle">Ahora toca el siguiente paso: conoce Kyndryl y apúntate a la experiencia.</p><div class="form-card"><p>Completa el formulario para apuntarte y seguir en contacto con nosotros.</p><a class="btn primary web-btn" href="${FORM_URL}" target="_self">Quiero apuntarme →</a></div><button id="restart" class="btn ghost">Volver a jugar</button>`;screen.replaceChildren(c);for(let i=0;i<18;i++){const s=document.createElement('span');s.className='confetti-piece';s.style.left=(3+i*5.3)+'%';s.style.animationDelay=(i*.04)+'s';c.querySelector('#conf').appendChild(s)}c.querySelector('#restart').onclick=()=>{clearSession();S.alias='';S.step=-1;S.start=null;S.elapsed=0;S.results={};S.scavAnswer='';S.scavTries=0;go(-1)}}
const restored=restoreSession();if(restored&&S.step!==undefined&&S.step!==-1){go(S.step);if(S.start&&!timerId){startTimer()}}else{clearSession();go(-1)}
})();
</script>
</body>
